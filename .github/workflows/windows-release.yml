name: SIDEY Windows release
run-name: "SIDEY Windows release | v${{ inputs.confirm_version }}"

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'release/windows.json의 releaseVersion을 정확히 입력하세요.'
        required: true
        type: string
      public_repository:
        description: '게시할 Public owner/repository를 입력하세요.'
        required: false
        default: sidey-app/SIDEY
        type: string
      deploy_website:
        description: '별도 승인된 경우에만 공개 웹사이트와 업데이트 안내를 배포합니다.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PUBLIC_REPOSITORY: ${{ inputs.public_repository }}

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      product_version: ${{ steps.versions.outputs.product_version }}
      release_version: ${{ steps.versions.outputs.release_version }}
      tag: ${{ steps.versions.outputs.tag }}
      installer_name: ${{ steps.versions.outputs.installer_name }}
      release_notes: ${{ steps.versions.outputs.release_notes }}
      commit: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Read and validate release metadata
        id: metadata
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          python ./scripts/skills/verify_release_consistency.py `
            --platform windows `
            --github-output $env:GITHUB_OUTPUT

          $manifest = Get-Content ./release/windows.json -Raw | ConvertFrom-Json
          $releaseVersion = [string]$manifest.releaseVersion
          if ($env:CONFIRM_VERSION -cne $releaseVersion) {
            throw "Version confirmation must exactly match release/windows.json releaseVersion: $releaseVersion"
          }

      - name: Resolve Product and Windows release versions
        id: versions
        run: |
          $productVersion = python -X utf8 ./scripts/sidey_version.py --get productVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the SIDEY Product Version: exit code $LASTEXITCODE"
          }
          $releaseVersion = python -X utf8 ./scripts/sidey_version.py --get windowsReleaseVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the SIDEY Windows Release Version: exit code $LASTEXITCODE"
          }
          "product_version=$productVersion" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "tag=windows-v$releaseVersion" >> $env:GITHUB_OUTPUT
          "installer_name=SIDEY-Windows-x64-v$releaseVersion-Setup.exe" >> $env:GITHUB_OUTPUT
          "release_notes=docs/releases/windows-v$releaseVersion.md" >> $env:GITHUB_OUTPUT

      - name: Record release commit
        id: commit
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - name: Verify Windows product catalog and assets
        run: python -X utf8 ./windows/tools/sync_product_assets.py --check

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Upload coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-release-code-coverage-${{ steps.versions.outputs.product_version }}
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Install pinned NSIS compiler
        id: nsis
        run: |
          winget install NSIS.NSIS `
            --exact `
            --version 3.12 `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw 'NSIS 3.12 makensis.exe was not installed.'
          }
          "makensis_path=$makensis" >> $env:GITHUB_OUTPUT

      - name: Build Setup EXE candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($architecture in @('x64', 'arm64')) {
            $publishDirectory = "build/windows/publish-$architecture"
            $platform = if ($architecture -eq 'arm64') { 'ARM64' } else { 'x64' }
            dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
              --configuration Release `
              --runtime "win-$architecture" `
              "-p:Platform=$platform" `
              --self-contained true `
              -p:PublishSingleFile=false `
              --output $publishDirectory
            ./scripts/windows/tests/Test-SelfContainedPublish.ps1 `
              -PublishDirectory $publishDirectory -Architecture $architecture
            ./scripts/windows/New-WindowsInstaller.ps1 `
              -PublishDirectory $publishDirectory `
              -OutputDirectory ./build/windows/artifacts `
              -ProductVersion '${{ steps.versions.outputs.product_version }}' `
              -ReleaseVersion '${{ steps.versions.outputs.release_version }}' `
              -Architecture $architecture `
              -MakensisPath '${{ steps.nsis.outputs.makensis_path }}'
          }

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v5
        with:
          name: windows-release-candidate-${{ steps.versions.outputs.release_version }}
          path: |
            build/windows/artifacts/SIDEY-Windows-*-v${{ steps.versions.outputs.release_version }}-Setup.exe
            build/windows/artifacts/SIDEY-Windows-*-v${{ steps.versions.outputs.release_version }}-Update.exe
            build/windows/artifacts/SIDEY-Windows-*-v${{ steps.versions.outputs.release_version }}-Update.json
            build/windows/artifacts/SIDEY-Windows-*-v${{ steps.versions.outputs.release_version }}-Payload.bin
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download Windows candidate
        uses: actions/download-artifact@v5
        with:
          name: windows-release-candidate-${{ needs.validate.outputs.release_version }}
          path: release-assets

      - name: Resolve public repository
        id: public_repository
        shell: bash
        run: |
          set -euo pipefail
          owner="${PUBLIC_REPOSITORY%%/*}"
          name="${PUBLIC_REPOSITORY#*/}"
          if [[ -z "$owner" || -z "$name" || "$owner" == "$name" || "$name" == */* ]]; then
            echo "Invalid public repository: $PUBLIC_REPOSITORY" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create scoped public publisher token
        id: public_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SIDEY_PUBLIC_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SIDEY_PUBLIC_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ steps.public_repository.outputs.owner }}
          repositories: ${{ steps.public_repository.outputs.name }}

      - name: Create, verify, and publish release
        env:
          GH_TOKEN: ${{ steps.public_token.outputs.token }}
          GH_REPO: ${{ env.PUBLIC_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ needs.validate.outputs.tag }}'
          $installerName = '${{ needs.validate.outputs.installer_name }}'
          $releaseVersion = '${{ needs.validate.outputs.release_version }}'
          $expectedAssetNames = @(foreach ($architecture in @('x64', 'arm64')) {
            foreach ($suffix in @('Setup.exe', 'Update.exe', 'Update.json', 'Payload.bin')) {
              "SIDEY-Windows-$architecture-v$releaseVersion-$suffix"
            }
          })
          $candidates = @($expectedAssetNames | ForEach-Object {
            $assetPath = Join-Path ./release-assets $_
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Missing candidate release asset: $_"
            }
            $assetPath
          })

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists) {
            throw "Release already exists: $tag"
          }

          gh release create $tag @candidates `
            --target main `
            --title "SIDEY Windows v${{ needs.validate.outputs.product_version }}" `
            --notes-file '${{ needs.validate.outputs.release_notes }}' `
            --draft

          $release = gh release view $tag --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if (-not $release.isDraft -or $release.isPrerelease) {
            throw "Release verification expected a regular draft: $tag"
          }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($assetNames.Count -ne 8 -or @(Compare-Object $expectedAssetNames $assetNames -CaseSensitive).Count -ne 0) {
            throw 'Draft release must contain exactly the eight x64 and ARM64 Windows assets.'
          }

          New-Item -ItemType Directory -Path ./release-verify -Force | Out-Null
          foreach ($assetName in $expectedAssetNames) {
            gh release download $tag `
              --pattern $assetName `
              --dir ./release-verify `
              --clobber
            $candidateHash = (Get-FileHash -LiteralPath (Join-Path ./release-assets $assetName) -Algorithm SHA256).Hash
            $downloadedHash = (Get-FileHash `
              -LiteralPath (Join-Path ./release-verify $assetName) `
              -Algorithm SHA256).Hash
            if ($candidateHash -cne $downloadedHash) {
              throw "Downloaded draft asset does not match the validated candidate: $assetName"
            }
          }

          gh release edit $tag --draft=false
          $published = gh release view $tag --json isDraft,isPrerelease |
            ConvertFrom-Json
          if ($published.isDraft -or $published.isPrerelease) {
            throw "Release was not published as a regular release: $tag"
          }

  deploy_website:
    name: Update release website
    needs: publish
    if: ${{ inputs.deploy_website }}
    uses: ./.github/workflows/website-deployment.yml
    with:
      public_repository: ${{ inputs.public_repository }}
    secrets:
      SIDEY_PUBLIC_PUBLISHER_PRIVATE_KEY: ${{ secrets.SIDEY_PUBLIC_PUBLISHER_PRIVATE_KEY }}
