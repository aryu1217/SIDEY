name: SIDEY Website deployment
run-name: SIDEY Website deployment | ${{ github.event_name }} | ${{ github.event.action || 'dispatch' }} | ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'website/src/**'
      - 'website/public/**'
      - 'website/astro.config.mjs'
      - 'website/package.json'
      - 'website/pnpm-lock.yaml'
      - 'website/pnpm-workspace.yaml'
      - 'website/tsconfig.json'
      - 'scripts/pages/**'
      - 'scripts/publication/**'
      - '.github/workflows/website-deployment.yml'
  workflow_dispatch:
    inputs:
      public_repository:
        description: '게시할 Public owner/repository를 입력하세요.'
        required: false
        default: sidey-app/SIDEY
        type: string
  workflow_call:
    inputs:
      public_repository:
        description: '게시할 Public owner/repository'
        required: false
        default: sidey-app/SIDEY
        type: string
    secrets:
      SIDEY_PUBLIC_PUBLISHER_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  PUBLIC_REPOSITORY: ${{ inputs.public_repository || 'sidey-app/SIDEY' }}

concurrency:
  group: pages-${{ inputs.public_repository || 'sidey-app/SIDEY' }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build and test website
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test

      - name: Validate central pixel assets and mirrors
        run: python3 ./scripts/validate_pixel_assets.py

      - name: Validate release metadata preparation
        run: python3 -m unittest discover -s scripts/pages/tests

      - name: Validate public artifact guard
        run: python3 -m unittest scripts.tests.test_publication

      - name: Upload tested website build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: pages-website-dist
          path: website/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested website build
        uses: actions/download-artifact@v5
        with:
          name: pages-website-dist
          path: website/dist

      - name: Resolve public repository
        id: public_repository
        shell: bash
        run: |
          set -euo pipefail
          owner="${PUBLIC_REPOSITORY%%/*}"
          name="${PUBLIC_REPOSITORY#*/}"
          if [[ -z "$owner" || -z "$name" || "$owner" == "$name" || "$name" == */* ]]; then
            echo "Invalid public repository: $PUBLIC_REPOSITORY" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create scoped public publisher token
        id: public_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SIDEY_PUBLIC_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SIDEY_PUBLIC_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ steps.public_repository.outputs.owner }}
          repositories: ${{ steps.public_repository.outputs.name }}

      - name: Prepare verified release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.public_token.outputs.token }}
          GH_REPO: ${{ env.PUBLIC_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content ./release/windows.json -Raw | ConvertFrom-Json
          $productVersion = [string]$manifest.version
          $releaseVersion = if ($manifest.PSObject.Properties.Name -contains 'releaseVersion') {
            [string]$manifest.releaseVersion
          } else {
            $productVersion
          }
          $tag = "windows-v$releaseVersion"
          $installerName = "SIDEY-Windows-x64-v${releaseVersion}-Setup.exe"
          $incrementalNames = @(
            "SIDEY-Windows-x64-v${releaseVersion}-Update.exe",
            "SIDEY-Windows-x64-v${releaseVersion}-Update.json",
            "SIDEY-Windows-x64-v${releaseVersion}-Payload.bin"
          )

          $release = gh release view $tag --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Windows release must be a published regular release: $tag"
          }
          $complianceContract = Get-Content `
            ./scripts/publication/compliance-source-assets.json -Raw |
            ConvertFrom-Json
          $complianceAssetNames = @(
            $complianceContract.assets |
              Where-Object { [string]$_.tag -ceq $tag } |
              ForEach-Object { [string]$_.name }
          )
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          $presentIncrementalNames = @($incrementalNames | Where-Object {
            $assetNames -ccontains $_
          })
          if ($presentIncrementalNames.Count -ne 0 -and
              $presentIncrementalNames.Count -ne $incrementalNames.Count) {
            throw "Windows incremental release requires all three assets: $tag"
          }
          $arm64Names = @('Setup.exe', 'Update.exe', 'Update.json', 'Payload.bin' | ForEach-Object {
            "SIDEY-Windows-arm64-v${releaseVersion}-$_"
          })
          $presentArm64Names = @($arm64Names | Where-Object { $assetNames -ccontains $_ })
          if ($presentArm64Names.Count -ne 0 -and $presentArm64Names.Count -ne 4) {
            throw "ARM64 release requires its separate installer and complete update trio: $tag"
          }
          $expectedAssetNames = @($installerName) + $complianceAssetNames +
            $presentIncrementalNames + $presentArm64Names
          $unexpectedAssetNames = @($assetNames | Where-Object {
            $expectedAssetNames -cnotcontains $_
          })
          $missingAssetNames = @($expectedAssetNames | Where-Object {
            $assetNames -cnotcontains $_
          })
          if ($unexpectedAssetNames.Count -ne 0 -or $missingAssetNames.Count -ne 0) {
            throw "Windows release assets do not match the installer and compliance contract: $tag"
          }

          New-Item -ItemType Directory -Path ./build/windows-pages-release -Force |
            Out-Null
          gh release download $tag `
            --pattern $installerName `
            --dir ./build/windows-pages-release `
            --clobber

          $metadataArguments = @(
            './scripts/pages/prepare_release_metadata.py',
            '--website-dir', './website/dist',
            '--output-dir', './build/pages-site',
            '--windows-release-manifest', './release/windows.json',
            '--windows-release-installer', "./build/windows-pages-release/$installerName",
            '--public-repository', $env:PUBLIC_REPOSITORY
          )
          if ($presentIncrementalNames.Count -ne 0) {
            foreach ($incrementalName in $incrementalNames) {
              gh release download $tag `
                --pattern $incrementalName `
                --dir ./build/windows-pages-release `
                --clobber
            }
            $metadataArguments += @(
              '--windows-incremental-manifest',
              "./build/windows-pages-release/SIDEY-Windows-x64-v${releaseVersion}-Update.json"
            )
          }
          if ($releaseVersion -cne $productVersion) {
            $legacyTag = "windows-v$productVersion"
            $legacyInstallerName = "SIDEY-Windows-x64-v${productVersion}-Setup.exe"
            $legacyRelease = gh release view $legacyTag --json isDraft,isPrerelease,assets |
              ConvertFrom-Json
            if ($legacyRelease.isDraft -or $legacyRelease.isPrerelease) {
              throw "Windows bridge release must be a published regular release: $legacyTag"
            }
            $legacyAssetNames = @(
              $legacyRelease.assets | ForEach-Object { [string]$_.name }
            )
            if ($legacyAssetNames -cnotcontains $legacyInstallerName) {
              throw "Windows bridge release installer is missing: $legacyTag/$legacyInstallerName"
            }
            New-Item -ItemType Directory -Path ./build/windows-pages-legacy -Force |
              Out-Null
            gh release download $legacyTag `
              --pattern $legacyInstallerName `
              --dir ./build/windows-pages-legacy `
              --clobber
            $metadataArguments += @(
              '--windows-legacy-installer',
              "./build/windows-pages-legacy/$legacyInstallerName"
            )
          }
          if ($presentArm64Names.Count -ne 0) {
            foreach ($arm64Name in $arm64Names) {
              gh release download $tag --pattern $arm64Name `
                --dir ./build/windows-pages-release --clobber
            }
            $metadataArguments += @(
              '--windows-arm64-installer',
              "./build/windows-pages-release/SIDEY-Windows-arm64-v${releaseVersion}-Setup.exe",
              '--windows-arm64-incremental-manifest',
              "./build/windows-pages-release/SIDEY-Windows-arm64-v${releaseVersion}-Update.json"
            )
          }
          python3 @metadataArguments

      - name: Reject private files from public artifact
        run: >-
          python3 ./scripts/publication/validate_public_tree.py
          --root ./build/pages-site
          --repository "$PUBLIC_REPOSITORY"

      - name: Check out public distribution repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PUBLIC_REPOSITORY }}
          ref: main
          path: build/public-repository
          token: ${{ steps.public_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Publish tested website to public gh-pages branch
        shell: bash
        working-directory: build/public-repository
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          git rm -r --ignore-unmatch .
          cp -R ../pages-site/. .
          git add --all
          if git diff --cached --quiet; then
            echo 'Public website is already current.'
            exit 0
          fi
          git config user.name 'SIDEY Public Publisher'
          git config user.email 'sidey-public-publisher[bot]@users.noreply.github.com'
          git commit -m "Publish SIDEY website from ${SOURCE_SHA}"
          git push origin HEAD:gh-pages
